{% extends "base.html" %}
{% block title %}Diagnostic Complete | R M Tutors{% endblock %}

{% block content %}
<div class="card">
  <h1 class="page-title">Diagnostic Submitted ✅</h1>
  <p class="page-subtitle">Your tutor will review your answers before the demo class.</p>

  <div class="stats">
    <div class="stat"><strong>Total</strong><br>{{ total }}</div>
    <div class="stat"><strong>Correct</strong><br>{{ correct }}</div>
    <div class="stat"><strong>Wrong</strong><br>{{ wrong }}</div>
  </div>

  <a class="btn" href="{% url 'student_dashboard' %}">Back to dashboard</a>
</div>
{% endblock %}
