{% extends "base.html" %}
{% block title %}Diagnostic Test | R M Tutors{% endblock %}

{% block content %}
<div class="card">
  <h1 class="page-title">Question {{ answered_count|add:1 }} of {{ total_count }}</h1>
  <p class="page-subtitle">{{ question.text }}</p>

  <form method="post" class="form">
    {% csrf_token %}

    <label class="option">
      <input type="radio" name="option" value="A" required>
      <span>A) {{ question.option_a }}</span>
    </label>

    <label class="option">
      <input type="radio" name="option" value="B" required>
      <span>B) {{ question.option_b }}</span>
    </label>

    <label class="option">
      <input type="radio" name="option" value="C" required>
      <span>C) {{ question.option_c }}</span>
    </label>

    <label class="option">
      <input type="radio" name="option" value="D" required>
      <span>D) {{ question.option_d }}</span>
    </label>

    <button class="btn" type="submit">Submit</button>
  </form>
</div>
{% endblock %}
