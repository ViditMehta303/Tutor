<h1>Diagnostic Test</h1>

<form method="post">
  {% csrf_token %}

  {% if question %}
    <p><b>{{ question.text }}</b></p>

    <label><input type="radio" name="selected_option" value="A"> {{ question.option_a }}</label><br>
    <label><input type="radio" name="selected_option" value="B"> {{ question.option_b }}</label><br>
    <label><input type="radio" name="selected_option" value="C"> {{ question.option_c }}</label><br>
    <label><input type="radio" name="selected_option" value="D"> {{ question.option_d }}</label><br>

  {% elif questions %}
    {% for q in questions %}
      <div style="margin-bottom: 20px;">
        <p><b>{{ forloop.counter }}. {{ q.text }}</b></p>

        <label><input type="radio" name="q_{{ q.id }}" value="A"> {{ q.option_a }}</label><br>
        <label><input type="radio" name="q_{{ q.id }}" value="B"> {{ q.option_b }}</label><br>
        <label><input type="radio" name="q_{{ q.id }}" value="C"> {{ q.option_c }}</label><br>
        <label><input type="radio" name="q_{{ q.id }}" value="D"> {{ q.option_d }}</label><br>
      </div>
    {% endfor %}
  {% else %}
    <p>No question found.</p>
  {% endif %}

  <button type="submit">Submit</button>
</form>
