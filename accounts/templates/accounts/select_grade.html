{% extends "base.html" %}

{% block title %}Select Grade | R M Tutors{% endblock %}

{% block content %}
  <div class="card">
    <h1 class="page-title">Select Your Grade</h1>
    <p class="page-subtitle">This helps us show the right diagnostic questions for your level.</p>

    <form method="post" class="form">
      {% csrf_token %}

      <label for="grade" class="label">Grade (1–10)</label>
      <select id="grade" name="grade" class="input" required>
        <option value="">Choose grade</option>
        <option value="1">Grade 1</option>
        <option value="2">Grade 2</option>
        <option value="3">Grade 3</option>
        <option value="4">Grade 4</option>
        <option value="5">Grade 5</option>
        <option value="6">Grade 6</option>
        <option value="7">Grade 7</option>
        <option value="8">Grade 8</option>
        <option value="9">Grade 9</option>
        <option value="10">Grade 10</option>
      </select>

      <button type="submit" class="btn">Continue</button>
    </form>
  </div>
{% endblock %}
